upstream isureal_asia {
  server 127.0.0.1:8080;
  keepalive 128;
}
upstream isureal_asia_reads {
  server 127.0.0.1:8083;
  keepalive 128;
}
# GET is served by the read process against the local hot standby; writes stay on the primary-connected process.
map $request_method $isureal_asia_upstream {
  default isureal_asia;
  GET     isureal_asia_reads;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://$isureal_asia_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
}
