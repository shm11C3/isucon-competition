upstream isureal_asia {
  server 127.0.0.1:8080;
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 16m;
  root /home/isucon/webapp/public;

  # Oversized uploads are refused before the body is read; the app's 400 shape is kept.
  error_page 413 = @oversized_upload;
  location @oversized_upload {
    default_type application/json;
    return 400 '{"error":"invalid_upload"}';
  }

  location = /api/me/profile-image {
    client_max_body_size 2m;
    error_page 413 = @oversized_profile_image;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://isureal_asia;
  }
  location @oversized_profile_image {
    default_type application/json;
    return 400 '{"error":"invalid_profile_image"}';
  }

  location ~ ^/api/posts/[^/]+/realmojis$ {
    client_max_body_size 2m;
    error_page 413 = @oversized_realmoji;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://isureal_asia;
  }
  location @oversized_realmoji {
    default_type application/json;
    return 400 '{"error":"invalid_realmoji"}';
  }

  location = /api/posts {
    error_page 413 = @oversized_post;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://isureal_asia;
  }
  location @oversized_post {
    default_type application/json;
    return 400 '{"error":"invalid_post"}';
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://isureal_asia;
  }

  location / {
    try_files $uri /index.html;
  }
}
