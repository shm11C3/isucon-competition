upstream isureal_asia_post {
  server 192.168.3.10:8086;
  keepalive 64;
}

upstream isureal_asia {
  server 127.0.0.1:8080;
  keepalive 128;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location = /api/posts {
    limit_except POST { proxy_pass http://isureal_asia; }
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://isureal_asia_post;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://isureal_asia;
  }

  location / {
    try_files $uri /index.html;
  }
}
