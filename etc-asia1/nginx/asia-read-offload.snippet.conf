# Insert into etc-asia1/nginx/isureal.conf (server block) BEFORE "location /api/".
# Heavy, latency-tolerant asia GETs are answered by asia-region processes on the
# remote hosts (REGION=asia, local standby). Writes and feeds stay on asia1.
upstream isureal_asia_offload {
  server 192.168.2.10:8085;
  server 192.168.3.10:8085;
  keepalive 64;
}
map $request_method $isureal_asia_heavy_upstream {
  default isureal_asia;
  GET     isureal_asia_offload;
}
location ~ ^/api/(memories|me/export|users)(/|$) {
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_http_version 1.1;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_pass http://$isureal_asia_heavy_upstream;
}
