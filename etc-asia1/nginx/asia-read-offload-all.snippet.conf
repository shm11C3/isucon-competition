# 案F-all: every asia GET except images and the SSE stream is answered by the
# asia-region processes on the remote hosts (local standby). Writes, images and
# notifications stay on asia1. Insert into the asia1 server block before "location /api/".
upstream isureal_asia_offload {
  server 192.168.3.10:8085;
  # server 192.168.2.10:8085;   # add when europe1 has >400MB headroom
  keepalive 64;
}
map $request_method $isureal_asia_get_upstream {
  default isureal_asia;
  GET     isureal_asia_offload;
}
location ~ ^/api/(images|notifications)(/|$) {
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_http_version 1.1;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_pass http://isureal_asia;
}
location /api/ {
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_http_version 1.1;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_pass http://$isureal_asia_get_upstream;
}
