upstream isureal_near_db {
  server 192.168.1.10:8081;
  keepalive 256;
}
upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 64;
}
# GET is served by the regional app against the local hot standby; writes go to the DB-local app via the router.
upstream isureal_post {
  server 127.0.0.1:8084;
  keepalive 64;
}
# POST /api/posts decodes the JPEG here and sends one DB call to the primary.
map "$request_method:$uri" $isureal_upstream {
  default          isureal_near_db;
  "~^GET:"         isureal_local;
  "POST:/api/posts" isureal_post;
}
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 32m;
  root /home/isucon/webapp/public;
  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://$isureal_upstream;
  }
  location / {
    try_files $uri /index.html;
  }
}
